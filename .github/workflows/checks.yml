name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dependency-free Node; asserts the preinstall guard across pnpm major,
      # engineStrict, devEngines, and pin drift. Runs on the runner's own Node.
      - name: Preinstall guard battery
        run: node scripts/test/check-install.battery.mjs

      # Proves pnpm provisions and uses the pinned Node across a mismatched
      # ambient Node, a no-Node image, and a musl image (expected failure).
      # Uses the runner's Docker; the driver loops the cells itself rather than
      # a job matrix, because the no-Node and musl images cannot run
      # actions/checkout (a Node action) to become job containers.
      - name: Node/pnpm environment matrix
        run: bash scripts/test/env-matrix/run.sh
